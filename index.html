<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BTC/ETH Quant Paper Trading Terminal</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #000;
    --panel: rgba(255,255,255,0.035);
    --panel-2: rgba(255,255,255,0.06);
    --border: rgba(255,255,255,0.08);
    --border-hi: rgba(134,201,138,0.30);
    --ink: #f4f4fa;
    --ink-2: #c9c8da;
    --muted: #8f8ea8;
    --grid: rgba(255,255,255,0.06);
    --vio: #93c88a; --vio-2: #b0d9a5;
    --pink: #c9d64f; --blue: #82c98f; --orange: #d3c95e; --green: #7ecf8a; --red: #e0806e; --gold: #c9d64f; --teal: #8ad6b0;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #050609; color: var(--ink); min-height: 100vh; }
  #universe { position: fixed; inset: 0; z-index: 0; background: radial-gradient(ellipse at 50% 38%, #0a0c13, #050609 72%); }
  #universe canvas { width: 100%; height: 100%; display: block; }
  #uvVignette { position: absolute; inset: 0; pointer-events: none; background:
    radial-gradient(ellipse at 18% 22%, rgba(120,150,255,.04), transparent 55%),
    radial-gradient(ellipse at 84% 78%, rgba(94,234,212,.03), transparent 55%),
    radial-gradient(ellipse at 50% 50%, transparent 58%, rgba(0,0,0,.55) 100%); }
  .shell { display: flex; min-height: 100vh; position: relative; z-index: 1; pointer-events: none; }
  .topbar, .tabs, .banner, .card, .chip, footer { pointer-events: auto; }
  main { flex: 1; padding: 22px 36px 40px; min-width: 0; }
  .topbar { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; flex-wrap: wrap; }
  .topbar h1 { font-size: 16px; font-weight: 650; }
  .topbar .sub { font-size: 11.5px; color: var(--muted); }
  .conn { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--ink-2);
    padding: 6px 13px; border-radius: 999px; border: none; background: rgba(255,255,255,.07);
    backdrop-filter: blur(14px) brightness(1.3); box-shadow: inset 0 1px 0 rgba(255,255,255,.14); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); box-shadow: 0 0 8px currentColor; }
  .dot.ok { background: var(--green); color: var(--green); } .dot.err { background: var(--red); color: var(--red); }

  .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
  .tab-btn {
    padding: 9px 22px; border-radius: 999px; border: none; background: rgba(255,255,255,.07);
    color: var(--ink-2); font-size: 13px; font-weight: 650; cursor: pointer;
    backdrop-filter: blur(14px) brightness(1.3); -webkit-backdrop-filter: blur(14px) brightness(1.3);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.14);
  }
  .tab-btn.on {
    background: linear-gradient(135deg, #93ce93, #5da96f); color: #0c130d; border-color: var(--border-hi);
    box-shadow: 0 0 18px rgba(134,201,138,.35);
  }
  .tab-btn .mini { font-size: 10px; opacity: .75; font-weight: 500; margin-left: 6px; }
  .page { display: none; }
  .page.on { display: block; }

  .card {
    --glow: var(--vio);
    background: linear-gradient(150deg,
      color-mix(in srgb, var(--glow) 5%, rgba(255,255,255,.085)),
      rgba(16,18,16,.46) 55%,
      color-mix(in srgb, var(--glow) 2%, rgba(255,255,255,.04)));
    border: none; border-radius: 22px; padding: 18px 20px; position: relative;
    backdrop-filter: blur(16px) saturate(160%) brightness(1.32);
    -webkit-backdrop-filter: blur(16px) saturate(160%) brightness(1.32);
    box-shadow:
      0 18px 60px rgba(0,0,0,.45),
      0 0 80px color-mix(in srgb, var(--glow) 5%, transparent),
      inset 0 1px 0 rgba(255,255,255,.14),
      inset 0 -1px 0 color-mix(in srgb, var(--glow) 8%, rgba(255,255,255,.04));
  }
  .card::before {
    content: ""; position: absolute; inset: 0; border-radius: 22px; pointer-events: none;
    background: linear-gradient(165deg, rgba(255,255,255,.09) 0%, rgba(255,255,255,0) 30%, rgba(255,255,255,0) 72%, rgba(255,255,255,.045) 100%);
  }
  .card.g-vio    { --glow: var(--vio); }
  .card.g-blue   { --glow: var(--blue); }
  .card.g-green  { --glow: var(--green); }
  .card.g-orange { --glow: var(--orange); }
  .card.g-pink   { --glow: var(--pink); }
  .card.g-red    { --glow: var(--red); }
  .card.g-gold   { --glow: var(--gold); }
  .card.g-teal   { --glow: var(--teal); }
  .card h2 { font-size: 12.5px; font-weight: 650; color: var(--ink-2); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; letter-spacing: .02em; flex-wrap: wrap; }
  .card h2 .tag { font-size: 10px; color: var(--muted); font-weight: 500; }
  .legend { display: flex; gap: 13px; font-size: 11px; color: var(--ink-2); margin-left: auto; }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; vertical-align: -1px; margin-right: 5px; }

  .chips { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 12px; }
  .chip { display: flex; align-items: center; gap: 12px;
    background: linear-gradient(150deg,
      color-mix(in srgb, var(--c) 6%, rgba(255,255,255,.085)),
      rgba(16,18,16,.44) 55%,
      color-mix(in srgb, var(--c) 2%, rgba(255,255,255,.04)));
    border: none; border-radius: 20px; padding: 14px 15px;
    backdrop-filter: blur(16px) saturate(160%) brightness(1.3);
    -webkit-backdrop-filter: blur(16px) saturate(160%) brightness(1.3);
    box-shadow: 0 14px 44px rgba(0,0,0,.4), 0 0 60px color-mix(in srgb, var(--c) 5%, transparent),
      inset 0 1px 0 rgba(255,255,255,.14); }
  .chip .ring {
    width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-size: 17px; flex-shrink: 0;
    background: radial-gradient(circle at 32% 28%, rgba(255,255,255,.22), transparent 55%), var(--c);
    box-shadow: 0 0 16px color-mix(in srgb, var(--c) 55%, transparent);
  }
  .chip .k { font-size: 10.5px; color: var(--muted); margin-bottom: 3px; }
  .chip .v { font-size: 16.5px; font-weight: 700; line-height: 1.1; }
  .chip .d { font-size: 10px; color: var(--ink-2); margin-top: 2px; }
  .up { color: var(--green); } .down { color: var(--red); }

  .layout { display: grid; grid-template-columns: 1fr 300px; gap: 12px; }
  @media (max-width: 1080px) { .layout { grid-template-columns: 1fr; } }
  .col { display: flex; flex-direction: column; gap: 12px; min-width: 0; }

  .chart-box { position: relative; }
  .chart-box svg { display: block; width: 100%; }
  .tt { position: absolute; pointer-events: none; background: rgba(20,20,34,.92); border: 1px solid var(--border-hi);
    border-radius: 8px; padding: 7px 11px; font-size: 11px; color: var(--ink-2); display: none; z-index: 5; white-space: nowrap;
    backdrop-filter: blur(8px); box-shadow: 0 6px 20px rgba(0,0,0,.5); }
  .tt b { color: #fff; font-variant-numeric: tabular-nums; }

  .params { display: grid; grid-template-columns: 1fr auto; gap: 7px 12px; font-size: 12px; }
  .params .k { color: var(--muted); } .params .v { color: var(--ink); text-align: right; font-variant-numeric: tabular-nums; }
  .lev-row { display: flex; gap: 6px; margin-bottom: 8px; }
  .lev-btn { flex: 1; padding: 8px 0; text-align: center; border-radius: 9px; border: 1px solid var(--border);
    background: var(--panel-2); color: var(--ink-2); font-size: 12.5px; cursor: pointer; font-weight: 650; }
  .lev-btn.on { background: linear-gradient(135deg, #93ce93, #5da96f); color: #0c130d; border-color: var(--border-hi);
    box-shadow: 0 0 16px rgba(134,201,138,.35); }
  .lev-note { font-size: 10.5px; color: var(--muted); line-height: 1.5; margin-bottom: 10px; }

  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th { text-align: right; color: var(--muted); font-weight: 500; font-size: 10.5px; padding: 6px 9px; border-bottom: 1px solid var(--grid); letter-spacing: .04em; }
  th:first-child, td:first-child { text-align: left; }
  td { padding: 8px 9px; border-bottom: 1px solid var(--grid); text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-2); }
  td:first-child { color: var(--ink); }
  tr.ref td { opacity: .45; }
  tr.open-row td { background: rgba(134,201,138,.08); }
  .pill { padding: 2.5px 9px; border-radius: 999px; font-size: 10.5px; font-weight: 650; }
  .pill.win { background: rgba(52,211,153,.14); color: var(--green); }
  .pill.loss { background: rgba(248,113,113,.14); color: var(--red); }
  .pill.live { background: rgba(134,201,138,.16); color: var(--green); }
  .pill.refp { background: var(--panel-2); color: var(--muted); }
  .pill.tealp { background: rgba(45,212,191,.15); color: var(--teal); }
  .pill.goldp { background: rgba(251,191,36,.15); color: var(--gold); }

  .banner { border: 1px solid var(--border); border-radius: 13px; padding: 11px 15px; font-size: 12px; margin-bottom: 12px; display: none; backdrop-filter: blur(12px); }
  .banner.warn { display: block; background: rgba(251,191,36,.08); color: var(--gold); border-color: rgba(251,191,36,.3); }
  .banner.err  { display: block; background: rgba(248,113,113,.10); color: var(--red); border-color: rgba(248,113,113,.3); }
  .loading { text-align: center; color: var(--muted); padding: 80px 0; font-size: 13px; }
  .gauge-wrap { display: flex; flex-direction: column; align-items: center; padding: 4px 0 2px; }
  .gauge-val { font-size: 26px; font-weight: 750; margin-top: -46px; }
  .gauge-sub { font-size: 10.5px; color: var(--muted); margin-top: 2px; text-align: center; line-height: 1.5; }
  .donut-wrap { display: flex; align-items: center; gap: 16px; }
  .donut-leg { font-size: 11.5px; color: var(--ink-2); display: flex; flex-direction: column; gap: 7px; }
  .donut-leg i { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  .sys-box { border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; background: rgba(255,255,255,0.025); margin-bottom: 10px; }
  .sys-box .nm { font-size: 12.5px; font-weight: 650; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .acct-stats { display: flex; gap: 20px; flex-wrap: wrap; align-items: baseline; margin-bottom: 12px; }
  .acct-stats .big { font-size: 20px; font-weight: 700; }
  .acct-stats .lbl { font-size: 10.5px; color: var(--muted); }
  footer { color: var(--muted); font-size: 10.5px; line-height: 1.65; margin-top: 14px; }
  .gtiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 8px; margin-bottom: 12px; }
  .gtile { border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; background: rgba(255,255,255,.02); font-size: 10.5px; color: var(--ink-2); line-height: 1.5; }
  .gtile .gid { font-weight: 700; font-size: 11px; color: var(--ink); }
  .gtile.live { border-color: rgba(52,211,153,.45); box-shadow: 0 0 10px rgba(52,211,153,.15); }
  .hrow { display: flex; align-items: center; gap: 10px; font-size: 11px; color: var(--ink-2); }
  .hrow .lb { min-width: 96px; color: var(--muted); }
  .hrow .pv { min-width: 76px; text-align: right; font-variant-numeric: tabular-nums; }
  .hbar { height: 8px; border-radius: 99px; background: rgba(255,255,255,.09); overflow: hidden; position: relative; flex: 1; }
  .hbar i { position: absolute; top: 0; bottom: 0; left: 0; border-radius: 99px; display: block;
    background: linear-gradient(90deg, #8fd694, #c9d64f); }
  .segbar { display: flex; height: 10px; border-radius: 99px; overflow: hidden; gap: 2px; }
  .segbar i { display: block; height: 100%; }
  @media (max-width: 760px) {
    main { padding: 14px 12px 30px; }
    .topbar h1 { font-size: 14px; }
    .tabs { flex-wrap: wrap; }
    .tab-btn { padding: 8px 13px; font-size: 12px; }
    .tab-btn .mini { display: none; }
    #heroSky { height: 46vh !important; min-height: 300px !important; }
    .card { padding: 14px 14px; border-radius: 18px; }
    .chip .ring { width: 36px; height: 36px; font-size: 14px; }
    .chip .v { font-size: 14.5px; }
    .hrow .lb { min-width: 68px; font-size: 10px; }
    .hrow .pv { min-width: 58px; font-size: 10px; }
    .legend { display: none; }
    #heroSky > div:nth-child(2), #heroSky > div:nth-child(3) { display: none; }
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
<div id="universe">
  <canvas id="galaxy"></canvas>
  <div id="uvVignette"></div>
  <div id="gLabels" style="position:absolute;inset:0;pointer-events:none;overflow:hidden"></div>
  <div class="tt" id="gTip"></div>
</div>
<div class="shell">
  <main>
    <div class="topbar">
      <div>
        <h1>BTC/ETH Quant Paper Trading Terminal</h1>
        <div class="sub">Paper Trading · Live Binance data · 30s refresh · All strategies finalized via backtest + sensitivity checks</div>
      </div>
      <div class="conn"><span class="dot" id="connDot"></span><span id="connTxt">Connecting…</span></div>
    </div>

    <div class="banner" id="errBanner"></div>
    <div class="banner" id="skimBanner"></div>

    <div class="tabs" id="tabs" style="display:none">
      <button class="tab-btn on" data-p="0">Overview<span class="mini">All systems + Arena</span></button>
      <button class="tab-btn" data-p="1">Strategy 1 · Pulse Grid<span class="mini">Aggressive · Futures 3x</span></button>
      <button class="tab-btn" data-p="2">Strategy 2 · Trend Combo<span class="mini">Stable · Spot 1x</span></button>
    </div>

    <div id="app" class="loading">Loading history from Binance and replaying all strategies…</div>
  </main>
</div>

<template id="tpl">
<div class="page on" id="page0">
  <div class="chips">
    <div class="chip" style="--c:var(--blue)"><div class="ring">₿</div><div><div class="k">BTC / USDT</div><div class="v" id="ovPrice">–</div><div class="d" id="ovPriceD">–</div></div></div>
    <div class="chip" style="--c:var(--vio)"><div class="ring">1</div><div><div class="k">Strategy 1 · Pulse Grid</div><div class="v" id="ovS1Eq">–</div><div class="d" id="ovS1St">–</div></div></div>
    <div class="chip" style="--c:var(--teal)"><div class="ring">2</div><div><div class="k">Strategy 2 · Trend Combo</div><div class="v" id="ovS2Eq">–</div><div class="d" id="ovS2St">–</div></div></div>
    <div class="chip" style="--c:var(--gold)"><div class="ring">⚔</div><div><div class="k">Arena</div><div class="v" id="ovAGen" style="font-size:13px">Loading…</div><div class="d" id="ovATop">–</div></div></div>
  </div>

  <div id="heroSky" style="height:58vh;min-height:400px;position:relative;margin-bottom:14px">
    <div style="position:absolute;top:18px;left:6px">
      <div style="font:600 11px system-ui;letter-spacing:.44em;color:rgba(244,244,250,.88)">ENERGY&nbsp;CORE</div>
      <div style="font:500 10px system-ui;letter-spacing:.2em;color:var(--muted);margin-top:5px">Flow-field particle turbulence · 500-gene pool × 20 active</div>
    </div>
    <div style="position:absolute;bottom:12px;left:6px;font:500 9.5px system-ui;letter-spacing:.24em;color:var(--muted)">Scroll wheel · zoom&nbsp;&nbsp;&middot;&nbsp;&nbsp;Page scroll · camera push&nbsp;&nbsp;&middot;&nbsp;&nbsp;Hover a gene · view profile</div>
    <div style="position:absolute;bottom:12px;right:6px;font:500 9.5px system-ui;letter-spacing:.18em;color:var(--muted)"><span style="color:var(--green)">&#9679;</span> Profit&nbsp;&nbsp;<span style="color:var(--red)">&#9679;</span> Loss&nbsp;&nbsp;<span style="color:var(--gold)">&#9675;</span> Forward Top 5&nbsp;&nbsp;<span style="color:var(--teal)">&#9675;</span> In position</div>
  </div>

  <div class="card g-gold">
    <h2>Arena · Top 5 Summary <span class="tag" id="ovALoad">Loading arena data in background…</span>
      <span class="legend" style="margin-left:auto"><span><i style="background:var(--green);border-radius:50%"></i>Profit</span><span><i style="background:var(--red);border-radius:50%"></i>Loss</span><span><i style="background:var(--gold);border-radius:50%"></i>Forward Top 5</span><span><i style="background:var(--teal);border-radius:50%"></i>In position</span><span><i style="background:rgba(167,139,250,.35);border-radius:50%"></i>Gene-pool dust</span></span>
    </h2>
    <div style="overflow-x:auto">
    <table>
      <thead><tr><th>#</th><th>Gene</th><th>TF</th><th>Forward equity</th><th style="min-width:110px"></th><th>Trades</th><th>Status</th></tr></thead>
      <tbody id="ovTop5"><tr><td colspan="6" style="text-align:center;color:var(--muted)">–</td></tr></tbody>
    </table>
    </div>
    <div style="font-size:10.5px;color:var(--muted);margin-top:8px">Full leaderboard, evolution log, and rules live on the standalone Arena page (authoritative); this summary view shares the same data and seed, syncing about every 10 minutes.</div>
  </div>

  <div class="card g-blue" id="healthCard">
    <h2>System Health <span class="tag" id="hcOverall">Initializing…</span></h2>
    <div class="gtiles" id="hcItems" style="grid-template-columns:repeat(auto-fill,minmax(200px,1fr))"></div>
  </div>

  <div class="layout">
    <div class="col">
      <div class="card g-vio">
        <h2>Strategy 1 · Pulse Grid <span class="tag">Futures 3x · Aggressive</span></h2>
        <div class="params" id="ovS1Box"></div>
      </div>
    </div>
    <div class="col">
      <div class="card g-teal">
        <h2>Strategy 2 · Trend Combo <span class="tag">Spot 1x · Stable</span></h2>
        <div class="params" id="ovS2Box"></div>
      </div>
    </div>
  </div>
</div>
<div class="page" id="page1">
  <div class="chips">
    <div class="chip" style="--c:var(--blue)"><div class="ring">₿</div><div><div class="k">BTC / USDT</div><div class="v" id="tPrice">–</div><div class="d" id="tPriceD">–</div></div></div>
    <div class="chip" style="--c:var(--pink)"><div class="ring">↯</div><div><div class="k">24H Change</div><div class="v" id="tDrop">–</div><div class="d" id="tDropD">–</div></div></div>
    <div class="chip" style="--c:var(--vio)"><div class="ring">◉</div><div><div class="k">Strategy Status</div><div class="v" id="tState" style="font-size:13px">–</div><div class="d" id="tStateD">–</div></div></div>
    <div class="chip" style="--c:var(--green)"><div class="ring">$</div><div><div class="k">Strategy 1 Equity</div><div class="v" id="tEq">–</div><div class="d">Start $5,000 · 2026-08-07</div></div></div>
    <div class="chip" style="--c:var(--orange)"><div class="ring">Σ</div><div><div class="k">Cumulative Return</div><div class="v" id="tRet">–</div><div class="d" id="tRetD">–</div></div></div>
  </div>

  <div class="layout">
    <div class="col">
      <div class="card g-vio">
        <h2>BTC Price · Last 60 Days <span class="tag" id="gridTag"></span>
          <span class="legend"><span><i style="background:var(--vio-2)"></i>Price</span><span><i style="background:var(--orange)"></i>Trigger</span><span><i style="background:var(--green)"></i>Entry</span></span>
        </h2>
        <div class="chart-box" id="priceChart"></div>
      </div>
      <div class="card g-green">
        <h2>Strategy 1 Equity Curve <span class="tag">Closed trades + open P&L</span></h2>
        <div class="chart-box" id="eqChart"></div>
      </div>
      <div class="card g-red">
        <h2>Strategy 1 Trade Log <span class="tag">Gray = pre-launch signal replay ($5,000/trade reference)</span></h2>
        <div style="overflow-x:auto">
        <table>
          <thead><tr><th>Trigger date</th><th>Entry price</th><th>Status</th><th>Duration</th><th>Fills</th><th>Return</th><th>Account P&L</th></tr></thead>
          <tbody id="logBody"></tbody>
        </table>
        </div>
      </div>
    </div>
    <div class="col">
      <div class="card g-orange">
        <h2>Trigger Progress <span class="tag">-8% trigger line</span></h2>
        <div class="gauge-wrap">
          <div id="gauge"></div>
          <div class="gauge-val" id="gaugeVal">–</div>
          <div class="gauge-sub" id="gaugeSub">–</div>
        </div>
      </div>
      <div class="card g-blue">
        <h2>Current Grid Position</h2>
        <div id="posBody" style="font-size:12px;color:var(--ink-2)">–</div>
      </div>
      <div class="card g-pink">
        <h2>Signal Win Rate <span class="tag">Past year incl. replay</span></h2>
        <div class="donut-wrap"><div id="donut"></div><div class="donut-leg" id="donutLeg"></div></div>
      </div>
      <div class="card g-gold">
        <h2>Parameters & Leverage</h2>
        <div class="lev-row" id="levRow"></div>
        <div class="lev-note" id="levNote"></div>
        <div class="params" id="paramGrid"></div>
      </div>
    </div>
  </div>
</div>

<div class="page" id="page2">

  setData(scored) {

    if (this.geneGroup) this.scene.remove(this.geneGroup);
    const grp = new THREE.Group();
    const rng = A_rng(4242);
    this.genes = scored.map((x, i) => {
      const eq = A_DEP * (1 + x.s.ret / 100);
      const win = eq >= A_DEP;
      const fwd = i < 5 && x.s.trades >= 1;
      const sp = new THREE.Sprite(new THREE.SpriteMaterial({
        map: this.texDot, color: win ? 0x34d399 : 0xf87171, transparent: true,
        opacity: 0.95, blending: THREE.AdditiveBlending, depthWrite: false,
      }));
      const sz = Math.min(22, 11 + Math.abs(x.s.ret) / 9) * (fwd ? 1.2 : 1);
      sp.scale.set(sz, sz, 1);
      if (fwd) {
        const ring = new THREE.Sprite(new THREE.SpriteMaterial({
          map: this.texRing, color: 0xfbbf24, transparent: true, opacity: 0.6, depthWrite: false,
        }));
        ring.scale.set(1.55, 1.55, 1); sp.add(ring);
      }
      if (x.s.inPos) {
        const ring = new THREE.Sprite(new THREE.SpriteMaterial({
          map: this.texRing, color: 0x2dd4bf, transparent: true, opacity: 0.55, depthWrite: false,
        }));
        ring.scale.set(1.3, 1.3, 1); sp.add(ring);
      }
      grp.add(sp);

        d: x, eq, fwd, sp,
        a: 215 + i * 10 + rng() * 8,
        ph: rng() * Math.PI * 2,
        w: (0.10 + rng() * 0.15) * (rng() < 0.65 ? 1 : -1) * (x.s.inPos ? 1.5 : 1),

  loop() {
    requestAnimationFrame(() => this.loop());
    if (document.hidden || !this.renderer) return;
    this.t += 0.016;
    const t = this.t;

    /* ---- ENERGY: advect particles through a deterministic curl-like flow ---- */
    const F1 = 0.012, F2 = 0.031;
    const pos = this.corePos, spd = this.spd, NE = this.NE;
    const dt = 0.9;
    for (let i = 0, k = 0; i < NE; i++, k += 3) {
      const x = pos[k], y = pos[k + 1], z = pos[k + 2];
      let vx = Math.sin(y * F1 + t * 0.42) + 0.55 * Math.sin((z + y) * F2 + t * 0.71);
      let vy = Math.sin(z * F1 + t * 0.55) + 0.55 * Math.sin((x + z) * F2 + t * 0.63);
      let vz = Math.sin(x * F1 + t * 0.37) + 0.55 * Math.sin((y + x) * F2 + t * 0.89);
      const rr = Math.sqrt(x * x + y * y * 2.3 + z * z * 1.25);
      const over = Math.max(0, rr - 265) / 265;
      vx -= x * over * 0.055; vy -= y * over * 0.075; vz -= z * over * 0.06;
      const s = spd[i] * dt;
      pos[k] = x + vx * s; pos[k + 1] = y + vy * s; pos[k + 2] = z + vz * s;
    }
    this.core.geometry.attributes.position.needsUpdate = true;

    /* ---- atom electrons + comet trails ---- */
    if (this.electrons) {
      this.atom.rotation.y = t * 0.12;
      this.nuc.material.opacity = 0.72 + 0.16 * Math.sin(t * 2.1);
      const ev = this._ev;
      for (const e of this.electrons) {
        const a2 = e.o.ph + t * e.o.sp;
        ev.set(Math.cos(a2) * e.o.rx, 0, Math.sin(a2) * e.o.rz).applyMatrix4(e.mtx);
        e.el.position.copy(ev);
        const tp = e.tp;
        if (!e.started) { for (let k = 0; k < tp.length; k += 3) { tp[k] = ev.x; tp[k+1] = ev.y; tp[k+2] = ev.z; } e.started = true; }
        else { tp.copyWithin(3, 0, tp.length - 3); tp[0] = ev.x; tp[1] = ev.y; tp[2] = ev.z; }
        e.tg.attributes.position.needsUpdate = true;
      }
    }
    this.core.rotation.y = t * 0.03;
    this.matCore.uniforms.uOp.value = 0.78 + 0.07 * Math.sin(t * 0.5);
    const PO = this.poolOrb, PP = this.poolPos;
    for (let i = 0, k = 0, j = 0; i < 480; i++, k += 3, j += 5) {
      const ang = PO[j+1] + t * PO[j+2];
      const x = Math.cos(ang) * PO[j], z0 = Math.sin(ang) * PO[j];
      const ci = Math.cos(PO[j+3]), si = Math.sin(PO[j+3]);
      const y1 = -z0 * si, z1 = z0 * ci;
      const cn = Math.cos(PO[j+4]), sn = Math.sin(PO[j+4]);
      PP[k] = x * cn - z1 * sn; PP[k+1] = y1; PP[k+2] = x * sn + z1 * cn;
    }
    this.dust.geometry.attributes.position.needsUpdate = true;
    this.stars.rotation.y = t * 0.004;

    /* ---- gene orbits ---- */
    for (const g of this.genes) {
      const ang = g.ph + t * g.w;
      let x = Math.cos(ang) * g.a, z = Math.sin(ang) * g.a, y = 0;
      const y1 = y * Math.cos(g.inc) - z * Math.sin(g.inc);
      const z1 = y * Math.sin(g.inc) + z * Math.cos(g.inc);
      const x2 = x * Math.cos(g.node) - z1 * Math.sin(g.node);
      const z2 = x * Math.sin(g.node) + z1 * Math.cos(g.node);
      g.sp.position.set(x2, y1, z2);
    }

    /* ---- camera: auto-orbit + parallax + zoom ---- */
    this.camR += (this.targetR - this.camR) * 0.06;
    const scrollPush = Math.min(240, (window.scrollY || 0) * 0.35);
    const camA = t * 0.045 + this.mx * 0.45;
    const camR = Math.max(150, this.camR - scrollPush), camY = 40 - this.my * 70;
    this.cam.position.set(Math.sin(camA) * camR, camY, Math.cos(camA) * camR);
    this.cam.lookAt(0, 0, 0);

    /* ---- hover ---- */
    if (this.mouseNDC.x > -1.5 && this.genes.length) {
      this.ray.setFromCamera(this.mouseNDC, this.cam);
      const hits = this.ray.intersectObjects(this.genes.map(g => g.sp), false);
      const best = hits.length ? this.genes.find(g => g.sp === hits[0].object) : null;
      this.hover = best;
      if (best && this.tip && this.tipXY) {
        this.tip.style.display = "block";
        this.tip.style.left = Math.min(this.tipXY[0] + 14, this.W - 250) + "px";
        this.tip.style.top = (this.tipXY[1] + 14) + "px";
        this.tip.innerHTML = `<b>${best.d.g.id}</b> ${A_desc(best.d.g)}<br>@${best.d.g.tf} · <b class="${best.eq >= A_DEP ? "up" : "down"}">$${best.eq.toFixed(0)}</b> · ${best.d.s.trades} trades · ${best.d.s.side === 1 ? "● LONG" : best.d.s.side === -1 ? "● SHORT" : "○ FLAT"}${best.fwd ? " · ★ Forward Top 5" : ""}`;

function lineChart(el, series, opts) {
  const W = el.clientWidth || 640, H = opts.h || 260, padL = 52, padR = 10, padT = 12, padB = 22;
  const all = series.flatMap(s => s.pts);
  if (!all.length) { el.innerHTML = '<div class="loading">No data</div>'; return; }
  const xs = all.map(p => p[0]), ys = all.map(p => p[1]);
  let x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  if (opts.hlines) for (const h of opts.hlines) { y0 = Math.min(y0, h.v); y1 = Math.max(y1, h.v); }
  if (y1 - y0 < Math.abs(y1) * 0.01 + 1) { const mid = (y0 + y1) / 2; y0 = mid - Math.max(Math.abs(mid) * 0.02, 1); y1 = mid + Math.max(Math.abs(mid) * 0.02, 1); }
  const yr = (y1 - y0) || 1; y0 -= yr * 0.06; y1 += yr * 0.08;
  const X = t => padL + (t - x0) / ((x1 - x0) || 1) * (W - padL - padR);
  const Y = v => padT + (1 - (v - y0) / (y1 - y0)) * (H - padT - padB);
  const fmt = opts.fmt || (v => v.toFixed(0));
  const uid = "g" + Math.abs((x0 + H + W) | 0).toString(36);
  let g = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">`;
  g += `<defs><linearGradient id="${uid}" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="${series[0].color}" stop-opacity="0.28"/>
    <stop offset="100%" stop-color="${series[0].color}" stop-opacity="0"/></linearGradient></defs>`;
  for (let k = 0; k <= 4; k++) {
    const v = y0 + (y1 - y0) * k / 4, y = Y(v);
    g += `<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="var(--grid)" stroke-width="1"/>`;
    g += `<text x="${padL - 7}" y="${y + 4}" fill="var(--muted)" font-size="10" text-anchor="end" style="font-variant-numeric:tabular-nums">${fmt(v)}</text>`;
  }
  const days = (x1 - x0) / 86400e3;
  const tickN = Math.min(6, Math.max(2, Math.floor(days / 10)));
  for (let k = 0; k <= tickN; k++) {
    const t = x0 + (x1 - x0) * k / tickN, x = X(t);
    const d = new Date(t);
    g += `<text x="${x}" y="${H - 6}" fill="var(--muted)" font-size="10" text-anchor="middle">${d.getUTCMonth() + 1}/${d.getUTCDate()}</text>`;
  }
  if (opts.band) {
    const yA = Y(opts.band.hi), yB = Y(opts.band.lo), xA = X(opts.band.from), xB = X(x1);
    g += `<rect x="${xA}" y="${yA}" width="${xB - xA}" height="${yB - yA}" fill="rgba(139,92,246,0.08)" rx="4"/>`;
  }
  if (opts.hlines) for (const h of opts.hlines) {
    const y = Y(h.v), xA = h.from ? X(h.from) : padL;
    g += `<line x1="${xA}" y1="${y}" x2="${W - padR}" y2="${y}" stroke="${h.color}" stroke-width="1" ${h.dash ? 'stroke-dasharray="4 4"' : ''} opacity="${h.op || 0.85}"/>`;
    if (h.label) g += `<text x="${W - padR - 3}" y="${y - 4}" fill="${h.color}" font-size="9.5" text-anchor="end">${h.label}</text>`;
  }
  series.forEach((s, si) => {
    const d = s.pts.map((p, idx) => (idx ? "L" : "M") + X(p[0]).toFixed(1) + " " + Y(p[1]).toFixed(1)).join("");
    if (si === 0 && opts.area !== false) {
      const dA = d + `L${X(s.pts[s.pts.length - 1][0]).toFixed(1)} ${H - padB}L${X(s.pts[0][0]).toFixed(1)} ${H - padB}Z`;
      g += `<path d="${dA}" fill="url(#${uid})" stroke="none"/>`;
    }
    g += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.w || 2}" stroke-linejoin="round" style="filter:drop-shadow(0 0 6px color-mix(in srgb, ${s.color} 60%, transparent))"/>`;
  });
  if (opts.markers) for (const m of opts.markers) {
    const nearest = series[0].pts.reduce((a, p) => Math.abs(p[0] - m.ts) < Math.abs(a[0] - m.ts) ? p : a);
    g += `<circle cx="${X(m.ts)}" cy="${Y(nearest[1])}" r="4.5" fill="${m.color}" stroke="var(--bg)" stroke-width="2" style="filter:drop-shadow(0 0 6px ${m.color})"/>`;
  }
  g += `<line id="ch" x1="0" y1="${padT}" x2="0" y2="${H - padB}" stroke="rgba(167,139,250,.5)" stroke-width="1" style="display:none"/>`;
  g += `</svg>`;
  el.innerHTML = g + '<div class="tt"></div>';
  const svg = el.querySelector("svg"), tt = el.querySelector(".tt"), ch = el.querySelector("#ch");
  svg.addEventListener("mousemove", e => {
    const r = svg.getBoundingClientRect();
    const mx = (e.clientX - r.left) * (W / r.width);
    const t = x0 + (mx - padL) / (W - padL - padR) * (x1 - x0);
    const pts = series[0].pts;
    let best = pts[0]; for (const p of pts) if (Math.abs(p[0] - t) < Math.abs(best[0] - t)) best = p;
    ch.setAttribute("x1", X(best[0])); ch.setAttribute("x2", X(best[0])); ch.style.display = "block";
    const d = new Date(best[0]);
    tt.innerHTML = `${d.getUTCMonth() + 1}/${d.getUTCDate()} ${String(d.getUTCHours()).padStart(2, "0")}:00 UTC · <b>${fmt(best[1])}</b>`;
    tt.style.display = "block";
    const bx = (X(best[0]) / W) * r.width;
    tt.style.left = Math.min(bx + 12, r.width - tt.offsetWidth - 8) + "px";
    tt.style.top = "8px";
  });
  svg.addEventListener("mouseleave", () => { tt.style.display = "none"; ch.style.display = "none"; });
}
function gaugeChart(el, frac) {
  const W = 200, H = 128, cx = 100, cy = 108, R = 82, th = 13;
  const arc = (r, f0, f1) => {
    const px = a => [cx + r * Math.cos(a), cy - r * Math.sin(a)];
    const s = Math.PI * (1 - f0), e = Math.PI * (1 - f1);
    const [sx, sy] = px(s), [ex, ey] = px(e);
    return `M ${sx.toFixed(1)} ${sy.toFixed(1)} A ${r} ${r} 0 0 1 ${ex.toFixed(1)} ${ey.toFixed(1)}`;
  };
  const col = frac >= 1 ? "var(--red)" : frac > 0.6 ? "var(--orange)" : frac > 0.3 ? "var(--gold)" : "var(--green)";
  let g = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">`;
  g += `<path d="${arc(R, 0, 1)}" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="${th}" stroke-linecap="round"/>`;
  if (frac > 0.005) g += `<path d="${arc(R, 0, Math.min(frac, 1))}" fill="none" stroke="${col}" stroke-width="${th}" stroke-linecap="round" style="filter:drop-shadow(0 0 8px color-mix(in srgb, ${col} 70%, transparent))"/>`;
  for (const f of [0, .25, .5, .75, 1]) {
    const a = Math.PI * (1 - f);
    const x1 = cx + (R - th - 4) * Math.cos(a), y1 = cy - (R - th - 4) * Math.sin(a);
    const x2 = cx + (R - th - 9) * Math.cos(a), y2 = cy - (R - th - 9) * Math.sin(a);
    g += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="var(--muted)" stroke-width="1.5" opacity=".5"/>`;
  }
  g += `</svg>`;
  el.innerHTML = g;
}
function donutChart(el, segs) {
  const W = 120, H = 120, cx = 60, cy = 60, R = 46, th = 15;
  const tot = segs.reduce((s, x) => s + x.v, 0) || 1;
  let acc = 0, g = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">`;
  const C = 2 * Math.PI * R;

  g += `</svg>`;
  el.innerHTML = g;

  $("logBody").innerHTML = rows.join("") || '<tr><td colspan="7" style="text-align:center;color:var(--muted)">No signals yet</td></tr>';
  $("paramGrid").innerHTML = `

  $("levNote").textContent = LEV_RISK[state.lev];

function renderS2() {
  const px = state.price ? state.price.last : null;
  const pe = state.priceEth ? state.priceEth.last : null;
  if (!state.daily || !state.ethDaily || !px || !pe) return;
  $("p2Btc").textContent = fmtUSD(px);
  $("p2BtcD").innerHTML = `24h <span class="${state.price.pct >= 0 ? "up" : "down"}">${fmtP(state.price.pct)}</span>`;
  $("p2Eth").textContent = "$" + pe.toLocaleString("en-US", { maximumFractionDigits: 0 });
  $("p2EthD").innerHTML = `24h <span class="${state.priceEth.pct >= 0 ? "up" : "down"}">${fmtP(state.priceEth.pct)}</span>`;
  const sr = srLeg(state.daily, px, [14, 14, 3, 5], "SR·BTC");
  const ma = maLeg(state.daily, "MA·BTC");
  const ethMa = maLeg(state.ethDaily, "MA·ETH");
  const cand = srLeg(state.daily, px, [1, 2, 19, 14], "Candidate B");
  const srEq = subEquity(sr, px, CFG.SR_CAP);
  const maEq = subEquity(ma, px, CFG.MA_CAP);
  const ethEq = subEquity(ethMa, pe, CFG.ETH_CAP);
  const candEq = subEquity(cand, px, CFG.CAND_CAP);
  const btcTot = srEq + maEq;
  $("s2BtcEq").textContent = fmtUSD(btcTot);
  $("s2EthEq").textContent = fmtUSD(ethEq);
  const totRet = ((btcTot + ethEq) / 10000 - 1) * 100;
  $("s2TotRet").innerHTML = `<span class="${totRet >= 0 ? "up" : "down"}">${fmtP(totRet)}</span>`;
  const srPnl = sr.pos && sr.entry ? (px / sr.entry.p - 1) * 100 : null;
  $("s2SrBox").innerHTML = `<div class="nm">BTC · StochRSI weekly (14,14,3,5) ${legBadge(sr.pos)}</div>
    <div class="params">
      <div class="k">K / D</div><div class="v">${sr.K !== null ? sr.K.toFixed(1) : "–"} / ${sr.D !== null ? sr.D.toFixed(1) : "–"}</div>
      ${sr.pos ? `
      <div class="k">Entry</div><div class="v">${sr.entry.d} @ ${fmtUSD(sr.entry.p)}</div>
      <div class="k">Unrealized P&L</div><div class="v ${srPnl >= 0 ? "up" : "down"}">${fmtP(srPnl)}</div>
      <div class="k">Disaster SL (-20%)</div><div class="v" style="color:var(--red)">${fmtUSD(sr.slPrice)}</div>` : `
      <div class="k">Status</div><div class="v">${sr.K !== null && sr.D !== null && sr.K > sr.D ? "K above D · awaiting pullback golden cross" : "Awaiting K cross above D (weekly close confirm)"}</div>`}
      <div class="k">Sub-account ($2,500)</div><div class="v">${fmtUSD(srEq)}</div>
    </div>`;
  const maPnl = ma.pos && ma.entry ? (px / ma.entry.p - 1) * 100 : null;
  const maGap = ma.fast && ma.slow ? (ma.fast / ma.slow - 1) * 100 : null;
  $("s2MaBox").innerHTML = `<div class="nm">BTC · MA 10/150 daily ${legBadge(ma.pos)}</div>
    <div class="params">
      <div class="k">MA10 / MA150</div><div class="v">${ma.fast ? fmtUSD(ma.fast) : "–"} / ${ma.slow ? fmtUSD(ma.slow) : "–"}</div>
      <div class="k">Fast vs slow gap</div><div class="v ${maGap >= 0 ? "up" : "down"}">${maGap !== null ? fmtP(maGap) : "–"}</div>
      ${ma.pos ? `
      <div class="k">Entry</div><div class="v">${ma.entry.d} @ ${fmtUSD(ma.entry.p)}</div>
      <div class="k">Unrealized P&L</div><div class="v ${maPnl >= 0 ? "up" : "down"}">${fmtP(maPnl)}</div>` : `
      <div class="k">Status</div><div class="v">Awaiting golden cross (daily close confirm)</div>`}
      <div class="k">Sub-account ($2,500)</div><div class="v">${fmtUSD(maEq)}</div>
    </div>`;
  const ePnl = ethMa.pos && ethMa.entry ? (pe / ethMa.entry.p - 1) * 100 : null;
  const eGap = ethMa.fast && ethMa.slow ? (ethMa.fast / ethMa.slow - 1) * 100 : null;
  $("s2EthBox").innerHTML = `<div class="nm">ETH · MA 10/150 daily ${legBadge(ethMa.pos)}</div>
    <div class="params">
      <div class="k">MA10 / MA150</div><div class="v">${ethMa.fast ? "$" + ethMa.fast.toFixed(0) : "–"} / ${ethMa.slow ? "$" + ethMa.slow.toFixed(0) : "–"}</div>
      <div class="k">Fast vs slow gap</div><div class="v ${eGap >= 0 ? "up" : "down"}">${eGap !== null ? fmtP(eGap) : "–"}</div>
      ${ethMa.pos ? `
      <div class="k">Entry</div><div class="v">${ethMa.entry.d} @ $${ethMa.entry.p.toFixed(0)}</div>
      <div class="k">Unrealized P&L</div><div class="v ${ePnl >= 0 ? "up" : "down"}">${fmtP(ePnl)}</div>` : `
      <div class="k">Status</div><div class="v">Awaiting golden cross (daily close confirm)</div>`}
      <div class="k">Account ($5,000)</div><div class="v">${fmtUSD(ethEq)}</div>
    </div>`;
  // watchlist: three virtual candidates
  const roc = weeklyRegimeLeg(state.daily, px, "ROC4", (wc, i) => i >= 4 && wc[i] > wc[i - 4]);
  const rsiL = (() => {
    const { weeks, forming } = s2Weekly(state.daily);
    const wDone = forming ? weeks.slice(0, -1) : weeks;
    const wc = wDone.map(r => r[4]);
    const R = s2Rsi(wc, 14);
    const trades = []; let pos = 0, entry = null;
    for (let i = 1; i < wDone.length; i++) {
      const want = R[i] !== null && R[i] > 50 ? 1 : 0;
      if (want !== pos) {
        if (want === 1) entry = { d: iso(wDone[i][0]), p: wc[i] };
        else if (entry) trades.push({ sys: "RSI50", in: entry.d, out: iso(wDone[i][0]), pIn: entry.p, pOut: wc[i], sl: false });
        pos = want;
      }
    }
    return { pos, entry, trades };
  })();
  const rocEq = subEquity(roc, px, CFG.CAND_CAP);
  const rsiEq = subEquity(rsiL, px, CFG.CAND_CAP);
  const rocNow = rocReading(state.daily);
  const rsiNow = rsiReading(state.daily);
  const watchRow = (title, badge, leg, eq, reading) => {
    const pnl = leg.pos && leg.entry ? (px / leg.entry.p - 1) * 100 : null;
    const rec = leg.trades.length ? `${leg.trades.length} trades · ${leg.trades.filter(t => t.pOut > t.pIn).length} wins` : "None yet";
    return `<div class="sys-box"><div class="nm">${title} <span class="pill goldp">${badge}</span> ${legBadge(leg.pos)}</div>
      <div class="params">
        <div class="k">Reading</div><div class="v">${reading}</div>
        ${leg.pos && leg.entry ? `<div class="k">Entry</div><div class="v">${leg.entry.d} @ ${fmtUSD(leg.entry.p)}</div>
        <div class="k">Unrealized P&L</div><div class="v ${pnl >= 0 ? "up" : "down"}">${fmtP(pnl)}</div>` : ``}
        <div class="k">Virtual account · Record</div><div class="v">${fmtUSD(eq)} · ${rec}</div>
      </div></div>`;
  };
  $("watchList").innerHTML =
    watchRow("StochRSI (1,2,19,14)", "Candidate B", cand, candEq, `K ${cand.K !== null ? cand.K.toFixed(1) : "–"} / D ${cand.D !== null ? cand.D.toFixed(1) : "–"}`) +
    watchRow("ROC 4-week momentum", "Candidate C", roc, rocEq, rocNow !== null ? `4-wk change ${fmtP(rocNow)} (hold if >0)` : "–") +
    watchRow("RSI weekly >50", "Candidate D", rsiL, rsiEq, rsiNow !== null ? `RSI ${rsiNow.toFixed(1)} (hold if >50)` : "–");
  const startIso2 = iso(CFG.ACCOUNT_START);
  const allT = [...sr.trades, ...ma.trades, ...ethMa.trades]
    .sort((a, b) => (b.out === "Live SL" ? "9999" : b.out).localeCompare(a.out === "Live SL" ? "9999" : a.out)).slice(0, 12);
  $("s2Log").innerHTML = allT.map(t => {
    const g = (t.pOut / t.pIn - 1) * 100;
    const live = t.out === "Live SL" || t.out >= startIso2;
    const sysCell = t.sys + (t.sl ? ' <span class="pill loss">SL</span>' : "");
    return `<tr class="${live ? "" : "ref"}"><td>${sysCell}</td><td>${t.in}</td><td>${t.out}</td><td>${fmtUSD(t.pIn)}</td><td>${fmtUSD(t.pOut)}</td><td class="${g >= 0 ? "up" : "down"}">${fmtP(g)}</td></tr>`;
  }).join("") || '<tr><td colspan="6" style="text-align:center;color:var(--muted)">No trades yet</td></tr>';
}
function render() { renderOverview(); renderS1(); renderS2(); }
function buildLevRow() {
  $("levRow").innerHTML = LEVS.map(l => `<button class="lev-btn ${l === state.lev ? "on" : ""}" data-l="${l}">${l}x</button>`).join("");
  $("levRow").querySelectorAll("button").forEach(b => b.addEventListener("click", () => { state.lev = +b.dataset.l; buildLevRow(); render(); }));

function buildTabs() {

/* ================= System health checks ================= */
const HEALTH = { lastOk: null, failStreak: 0, clockSkew: null, alert: false };
const RNG_REF = [0.3797958354, 0.1758410509, 0.7595339064];
function hcEngineSelfTest() {
  try {
    const r = A_rng(A_SEED);
    for (let i = 0; i < 3; i++) if (Math.abs(r() - RNG_REF[i]) > 1e-9) return { ok: false, msg: "RNG sequence deviates from reference" };
    if (state.arena && state.arena.pool.length !== A_SEATS) return { ok: false, msg: "Abnormal population size " + state.arena.pool.length };
    return { ok: true, msg: "RNG matches reference · population " + (state.arena ? state.arena.pool.length : "-") + " seats" };
  } catch (e) { return { ok: false, msg: e.message }; }
}
function hcGaps(bars, stepMs, lookback) {
  if (!bars || bars.length < 10) return { gaps: -1, outlier: false };
  let gaps = 0, outlier = false;
  const from = Math.max(1, bars.length - lookback);
  for (let i = from; i < bars.length; i++) {
    if (bars[i][0] - bars[i-1][0] > stepMs * 1.5) gaps++;
    const r = bars[i][4] / bars[i-1][4] - 1;
    if (Math.abs(r) > 0.20) outlier = true;
  }
  return { gaps, outlier };
}
async function hcClock() {
  try {
    const t0 = Date.now();
    const r = await fetch("https://api.binance.com/api/v3/time").then(x => x.json());
    const rtt = Date.now() - t0;
    HEALTH.clockSkew = r.serverTime - (t0 + rtt / 2);
  } catch (e) {}
}
function renderHealth() {
  const el = $("hcItems");
  if (!el) return;
  const items = [];
  const item = (name, ok, msg, warn) => items.push({ name, st: ok ? "ok" : (warn ? "warn" : "bad"), msg });
  const age = HEALTH.lastOk ? (Date.now() - HEALTH.lastOk) / 1000 : Infinity;
  item("Binance link", age < 120, HEALTH.lastOk ? `Refreshed ${Math.round(age)}s ago · fail streak ${HEALTH.failStreak}` : "No success yet", age < 600);
  if (state.data.length) {
    const lag = (Date.now() - state.data[state.data.length-1][0]) / 3600e3;
    item("1h primary data", lag < 2.2, `Latest candle ${lag.toFixed(1)}h ago`, lag < 4);
  }
  const g1 = hcGaps(state.data, 3600e3, 500);
  item("Data integrity (1h×500)", g1.gaps === 0, g1.gaps > 0 ? `${g1.gaps} gaps` : "No gaps", g1.gaps <= 2);
  item("Anomaly scan", !g1.outlier, g1.outlier ? "A single candle moved >20% — verify manually" : "No >20% moves in the last 500 candles", false);
  if (HEALTH.clockSkew !== null) {
    const sk = Math.abs(HEALTH.clockSkew) / 1000;
    item("Clock drift", sk < 30, `Offset ${sk.toFixed(1)}s`, sk < 120);
  }
  if (state.arenaBars) {
    let worst = 0, name = "";
    for (const [tf, bars] of Object.entries(state.arenaBars)) {
      const lagBars = bars.length ? (Date.now() - bars[bars.length-1][0]) / A_TFMS[tf] : Infinity;
      if (lagBars > worst) { worst = lagBars; name = tf; }
    }
    item("Arena data", worst < 3, worst < 900 ? `Worst lag ${name} ~${worst.toFixed(1)} bars` : "Not loaded", worst < 12);
  } else item("Arena data", false, "Loading in background…", true);
  const se = hcEngineSelfTest();
  item("Engine determinism", se.ok, se.msg, false);
  el.innerHTML = items.map(x => {
    const col = x.st === "ok" ? "var(--green)" : x.st === "warn" ? "var(--gold)" : "var(--red)";
    const icon = x.st === "ok" ? "✓" : x.st === "warn" ? "◐" : "✗";
    return `<div class="gtile" style="border-color:color-mix(in srgb, ${col} 40%, transparent)"><div class="gid" style="color:${col}">${icon} ${x.name}</div>${x.msg}</div>`;
  }).join("");
  const bad = items.filter(x => x.st === "bad").length, warn = items.filter(x => x.st === "warn").length;
  const ov = $("hcOverall");
  HEALTH.alert = bad > 0;
  if (bad) { ov.textContent = `⚠ ${bad} failing · ${warn} warnings`; ov.style.color = "var(--red)"; }
  else if (warn) { ov.textContent = `◐ ${warn} warnings, rest OK`; ov.style.color = "var(--gold)"; }
  else { ov.textContent = "✓ All clear · " + new Date().toLocaleTimeString("en-GB", {timeZone:"Asia/Kuala_Lumpur"}); ov.style.color = "var(--green)"; }
}
let titleFlip = false;
const BASE_TITLE = document.title;
setInterval(() => {
  const R = state.data.length > 30 ? (() => { try { return replay(state.data, state.lev); } catch(e) { return null; } })() : null;
  const sigAlert = R && (R.waiting || R.openTrade);
  if (HEALTH.alert || sigAlert) {
    titleFlip = !titleFlip;
    document.title = titleFlip ? (HEALTH.alert ? "⚠ System alert" : "🔔 Strategy 1 signal") + " · Quant Terminal" : BASE_TITLE;
  } else if (document.title !== BASE_TITLE) document.title = BASE_TITLE;
}, 2000);

/* ================= Boot ================= */
async function boot() {
  try {
    state.data = await fetchKlines(CFG.REPLAY_START);
    await refreshTail();
    $("app").innerHTML = ""; $("app").className = "";
    $("app").appendChild($("tpl").content.cloneNode(true));
    buildLevRow(); buildTabs();
    Galaxy.init();
    render();
    HEALTH.lastOk = Date.now();
    hcClock().then(renderHealth);
    setInterval(hcClock, 600000);
    renderHealth();
    loadArenaLite();
    setInterval(loadArenaLite, 600000);
    $("connDot").className = "dot ok";
    $("connTxt").textContent = "Binance live · " + new Date().toLocaleTimeString("en-GB", { timeZone: "Asia/Kuala_Lumpur" });
    state.timer = setInterval(async () => {
      try {
        await refreshTail(); render();
        HEALTH.lastOk = Date.now(); HEALTH.failStreak = 0;
        $("connDot").className = "dot ok";
        $("connTxt").textContent = "Binance live · " + new Date().toLocaleTimeString("en-GB", { timeZone: "Asia/Kuala_Lumpur" });
      } catch (e) { HEALTH.failStreak++; $("connDot").className = "dot err"; $("connTxt").textContent = "Reconnecting… (fail streak " + HEALTH.failStreak + ")"; }
      renderHealth();
    }, 30000);
  } catch (e) {
    $("errBanner").className = "banner err";
    $("errBanner").textContent = "Cannot reach Binance market API (" + e.message + "). Check your network and refresh the page.";
    $("app").innerHTML = "";
  }
}
boot();
