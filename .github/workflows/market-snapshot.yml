# .github/workflows/market-snapshot.yml — 每 15 分鐘攞一次「多空分布」數據，寫入 data/live/market.json
name: market-snapshot
on:
  schedule:
    - cron: '7,22,37,52 * * * *'   # 每 15 分鐘（Kane 2026-09-17 要求；GitHub 會間中跳過，實際大約每 30–60 分鐘跑到一次）
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: market-snapshot
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Snapshot OKX + Hyperliquid
        env:
          HL_TOP_N: '400'
          COINS: 'BTC,ETH'
        run: node scripts/quant-market-snapshot.mjs
      - name: Commit
        run: |
          git config user.name "market-snapshot"
          git config user.email "actions@users.noreply.github.com"
          git add data/live/market.json data/live/liq-*.json
          git diff --cached --quiet || git commit -m "market snapshot $(date -u +%FT%H:%MZ)"
          git pull --rebase --autostash origin main || true
          git push
