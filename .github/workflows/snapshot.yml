name: hourly snapshot

# Opens the three research pages (Copy Desk, Signal Desk, REKT Lab) in a headless browser on GitHub's servers,
# waits for them to load and replay exactly as they do for a visitor, and commits a compact JSON snapshot to
# data/live/. The twice-daily report agents read those files. No secrets, no keys, read-only public data.

on:
  schedule:
    - cron: '5 * * * *'          # every hour at :05 UTC (GitHub may delay a few minutes)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Take snapshot
        run: node scripts/snapshot.mjs
      - name: Commit snapshot
        run: |
          git config user.name  'snapshot-bot'
          git config user.email 'snapshot-bot@users.noreply.github.com'
          git add data/live
          if git diff --cached --quiet; then echo 'nothing changed'; exit 0; fi
          git commit -m "snapshot $(date -u +'%Y-%m-%d %H:%M') UTC [skip ci]"
          for i in 1 2 3; do git push && break; git pull --rebase && sleep 5; done
